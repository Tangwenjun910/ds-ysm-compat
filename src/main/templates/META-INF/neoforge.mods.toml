modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
${mod_logo}
authors="Tangwenjun"
description='''
Lets Dragon Survival and Yes Steve Model coexist when both replace player rendering.

Both mods cancel the vanilla player renderer to draw their own model, so the result used to
depend on mod load order. This mod arbitrates between them using a client config option:

- AUTO (default): Yes Steve Model renders only when it actually replaces the model; otherwise
  Dragon Survival draws the dragon.
- YSM_PRIORITY: Yes Steve Model always handles player rendering.
- DS_PRIORITY: Dragon players are always rendered by Dragon Survival.

The option is available in the NeoForge config screen (Mods -> this mod -> Config).

Optionally, Dragon Survival flight can be reported to Yes Steve Model as creative flight, so YSM
models play their `fly` animation while a dragon is flying (client config: dragon_flight_animation).

Client side only. Built for NeoForge 1.21.1, Dragon Survival 2.0.7x and Yes Steve Model 2.6.5.
If either Dragon Survival or Yes Steve Model is missing, the mixins disable themselves.
'''

[[mixins]]
    config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.186,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dragonsurvival"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="yes_steve_model"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="NONE"
    side="CLIENT"
