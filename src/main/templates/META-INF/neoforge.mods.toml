modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
${mod_logo}
authors="Tangwenjun"
description='''
Client-side compatibility for Dragon Survival and Yes Steve Model on NeoForge 1.21.1.

Choose which mod renders your player. Fixes first-person arms and shadow placement, lets YSM play flight animations during dragon flight, and puts Dragon Survival emotes in YSM's wheel when the dragon model is active.
'''

[[mixins]]
    config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.186,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dragonsurvival"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="yes_steve_model"
    type="optional"
    versionRange="[2.0.0,)"
    ordering="NONE"
    side="CLIENT"
